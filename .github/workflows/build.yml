name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          for script in scripts/*.sh experiments/ffmpeg-patch/*.sh experiments/io-plugin/*.sh native-aac/privileged.sh; do
            bash -n "$script"
          done

      - name: Check Python scripts
        run: |
          python3 -m py_compile scripts/resolve_aac_*.py

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
          python3 -m pip install PySide6 python-xlib

      - name: Test native AAC and watcher lifecycle
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests -q
